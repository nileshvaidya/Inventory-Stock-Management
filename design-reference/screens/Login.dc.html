<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
      --color-accent: #9184d9; --color-accent-2: #a7a1db;
      --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
      --color-accent-100: #f5f4ff; --color-accent-700: #5d5294; --color-accent-900: #2b2741;
      --color-accent-2-200: #e7e5fe; --color-accent-2-700: #5c5783; --color-accent-2-900: #2b293a;
      --color-neutral-500: #9397ab;
      --font-heading: "Inter", system-ui, sans-serif; --font-heading-weight: 500; --font-body: "Inter", system-ui, sans-serif;
      --space-2: 5.6px; --space-3: 8.4px;
      --radius-md: 8px;
      --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
    }
    * , *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
    a { color: var(--color-accent); text-underline-offset: 3px; }
    a:hover { color: var(--color-accent-2); }
    .card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface); }
    .card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
    .field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
    .input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; color: var(--color-text); background: transparent; border: 1px solid transparent; padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: var(--radius-md); }
    .btn-primary { color: var(--color-accent); border-color: var(--color-accent); width: 100%; margin-top: 4px; }
    .seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: var(--radius-md); width: 100%; }
    .seg-opt { flex: 1; display: flex; align-items: center; justify-content: center; padding: 7px 12px; font-size: 13px; cursor: pointer; }
    .seg-opt.active { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
    .seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
    .notice { font-size: 13px; color: var(--color-accent-100); background: var(--color-accent-900); border: 1px solid var(--color-accent-700); border-radius: var(--radius-md); padding: 8px 12px; }
  </style>
</helmet>
<div style="width:1440px;height:900px;display:flex;align-items:center;justify-content:center;background:var(--color-bg)">
  <div class="card elev-sm" style="width:400px;box-shadow:var(--shadow-md)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="none">
        <rect x="28" y="28" width="200" height="200" rx="28" fill="none" stroke="#9184d9" stroke-width="16"/>
        <path d="M76 128 L112 164 L180 92" stroke="#9184d9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="card-kicker" style="margin:0">Inventory &amp; Stock Management</div>
    </div>
    <p style="font-size:12px;color:var(--color-neutral-500);margin:0 0 16px">by ASK Info-Solutions LLP</p>

    <div class="seg" style="margin-bottom:16px">
      <div class="seg-opt active">Sign In</div>
      <div class="seg-opt">Sign Up</div>
    </div>

    <form style="display:flex;flex-direction:column;gap:12px">
      <div class="field"><label>Email</label>
        <input class="input" type="email" value="accounts@askinfosolutions.example" />
      </div>
      <div class="field"><label>Password</label>
        <input class="input" type="password" value="••••••••••" />
      </div>
      <button type="button" class="btn btn-primary">Sign In</button>
    </form>
  </div>
</div>
</x-dc>
</body>
</html>
