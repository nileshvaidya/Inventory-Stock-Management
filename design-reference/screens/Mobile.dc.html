<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --color-bg: #161826; --color-surface: #232532; --color-text: #e9e9ed;
      --color-accent: #9184d9;
      --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
      --color-accent-100: #f5f4ff; --color-accent-800: #423a6a;
      --color-neutral-400: #b2b6ca; --color-neutral-500: #9397ab;
      --font-heading: "Inter", system-ui, sans-serif; --font-heading-weight: 500; --font-body: "Inter", system-ui, sans-serif;
      --radius-sm: 4px; --radius-md: 8px;
      --shadow-sm: 0 0 0 1px #3f424d;
    }
    * , *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
    h1 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 20px; margin: 0 0 4px; }
    .text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); font-size: 13px; }
    .card { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: var(--radius-md); background: var(--color-surface); }
    .card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
    .card-title { font-size: 15px; font-family: var(--font-heading); font-weight: var(--font-heading-weight); }
    .card-body { margin: 0; font-size: 12px; opacity: 0.8; }
    .elev-sm { box-shadow: var(--shadow-sm); }
    .avatar { border-radius: 50%; background: var(--color-accent-800); color: var(--color-accent-100); display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
    .icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 1px solid var(--color-divider); background: transparent; color: var(--color-neutral-400); display: flex; align-items: center; justify-content: center; font-size: 13px; }
    .tab { flex: 1; text-align: center; font-size: 9px; padding: 6px 2px; color: var(--color-neutral-500); }
    .tab.active { color: var(--color-accent); }
  </style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;background:var(--color-bg)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:8px">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="none">
        <rect x="28" y="28" width="200" height="200" rx="28" fill="none" stroke="#9184d9" stroke-width="16"/>
        <path d="M76 128 L112 164 L180 92" stroke="#9184d9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span style="font-family:var(--font-heading);font-weight:600;font-size:15px">Inventory &amp; Stock</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="icon-btn">?</div>
      <div class="icon-btn">&#9099;</div>
      <div class="avatar" style="width:28px;height:28px;font-size:11px">RM</div>
    </div>
  </div>

  <div style="flex:1;padding:16px;overflow:hidden">
    <h1>Welcome, Rakesh Mehta</h1>
    <p class="text-muted" style="margin-bottom:16px">Role: admin</p>
    <div class="card elev-sm">
      <div class="card-kicker">Phase 0</div>
      <div class="card-title">Scaffold, auth, and base shell</div>
      <p class="card-body">The Phase 0 landing page. Reports (Phase 8) and Action Log (Phase 9) shipped as their own screens.</p>
    </div>
  </div>

  <div style="display:flex;overflow-x:auto;padding:8px 4px;background:var(--color-surface);border-top:1px solid var(--color-divider)">
    <div class="tab active">Dashboard</div>
    <div class="tab">PO Upload</div>
    <div class="tab">Order Status</div>
    <div class="tab">Inventory</div>
    <div class="tab">Invoices</div>
    <div class="tab">Reports</div>
  </div>
</div>
</x-dc>
</body>
</html>
